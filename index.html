<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VideoHub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080d18;
  color:#fff;
}

header{
  background:#111827;
  padding:16px 20px;
  border-bottom:1px solid #263244;
}

.nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:bold;
  color:#60a5fa;
}

.hero{
  text-align:center;
  padding:55px 20px;
  background:linear-gradient(135deg,#111827,#172554);
}

.hero h1{
  font-size:40px;
  margin-bottom:10px;
}

.hero p{
  color:#cbd5e1;
}

.upload-section{
  max-width:800px;
  margin:35px auto;
  padding:0 18px;
}

.upload-card{
  background:#111827;
  border:1px solid #263244;
  border-radius:18px;
  padding:22px;
}

.upload-card h2{
  margin-bottom:8px;
}

.subtitle{
  color:#94a3b8;
  margin-bottom:22px;
}

/* GALLERY SELECT */

.gallery-button{
  display:block;
  width:100%;
  padding:35px 15px;
  text-align:center;
  border:2px dashed #3b82f6;
  border-radius:15px;
  background:#0f172a;
  cursor:pointer;
}

.gallery-button:active{
  background:#172554;
}

.gallery-icon{
  font-size:50px;
  margin-bottom:10px;
}

.gallery-title{
  font-size:19px;
  font-weight:bold;
}

.gallery-subtitle{
  color:#94a3b8;
  font-size:14px;
  margin-top:7px;
}

#videoInput{
  display:none;
}

/* SELECTED VIDEO */

#selectedArea{
  display:none;
  margin-top:20px;
}

#previewVideo{
  width:100%;
  max-height:500px;
  display:block;
  background:#000;
  border-radius:12px;
}

.selected-message{
  background:#064e3b;
  border:1px solid #10b981;
  color:#a7f3d0;
  padding:13px;
  border-radius:9px;
  margin-top:12px;
  text-align:center;
  font-weight:bold;
}

.file-name{
  color:#93c5fd;
  font-size:13px;
  margin-top:9px;
  word-break:break-word;
}

/* FORM */

.field{
  margin-top:18px;
}

.field label{
  display:block;
  margin-bottom:7px;
  font-weight:bold;
}

.field input,
.field textarea{
  width:100%;
  padding:13px;
  border-radius:9px;
  border:1px solid #334155;
  background:#0f172a;
  color:white;
  font-size:15px;
  outline:none;
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

/* UPLOAD BUTTON */

#uploadButton{
  width:100%;
  margin-top:22px;
  padding:17px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:#fff;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

#uploadButton:not(:disabled):active{
  transform:scale(.98);
}

#uploadButton:disabled{
  background:#475569;
  cursor:not-allowed;
}

/* PROGRESS */

#progressArea{
  display:none;
  margin-top:18px;
}

.progress-background{
  width:100%;
  height:10px;
  background:#1e293b;
  border-radius:20px;
  overflow:hidden;
}

#progressBar{
  width:0%;
  height:100%;
  background:#3b82f6;
  transition:width .3s;
}

#status{
  text-align:center;
  margin-top:10px;
  color:#93c5fd;
}

/* COMMUNITY */

.community{
  max-width:1100px;
  margin:60px auto;
  padding:0 18px;
}

.community-heading{
  text-align:center;
  margin-bottom:25px;
}

.community-heading h2{
  font-size:30px;
  margin-bottom:8px;
}

.community-heading p{
  color:#94a3b8;
}

#videoGallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

.video-card{
  background:#111827;
  border:1px solid #263244;
  border-radius:14px;
  overflow:hidden;
}

.video-card video{
  width:100%;
  display:block;
  background:#000;
  aspect-ratio:16/9;
}

.video-info{
  padding:14px;
}

.video-info h3{
  margin-bottom:7px;
  word-break:break-word;
}

.video-info p{
  color:#94a3b8;
  font-size:14px;
  word-break:break-word;
  line-height:1.5;
}

.message{
  grid-column:1/-1;
  text-align:center;
  color:#94a3b8;
  padding:30px;
}

footer{
  text-align:center;
  padding:35px 20px;
  margin-top:50px;
  border-top:1px solid #1e293b;
  color:#64748b;
}

@media(max-width:600px){

  .hero h1{
    font-size:32px;
  }

  .upload-card{
    padding:17px;
  }

  .gallery-button{
    padding:30px 12px;
  }

}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">🎬 VideoHub</div>
  </div>
</header>


<section class="hero">
  <h1>Share Your Video</h1>
  <p>Select a video from your phone and upload it.</p>
</section>


<section class="upload-section">

  <div class="upload-card">

    <h2>📹 Upload Video</h2>

    <p class="subtitle">
      Select any video from your phone gallery.
    </p>


    <!-- GALLERY BUTTON -->

    <label
      for="videoInput"
      class="gallery-button"
    >

      <div class="gallery-icon">📱</div>

      <div class="gallery-title">
        Choose Video from Gallery
      </div>

      <div class="gallery-subtitle">
        Tap here and select your video
      </div>

    </label>


    <input
      type="file"
      id="videoInput"
      accept="video/*"
    >


    <!-- SELECTED VIDEO -->

    <div id="selectedArea">

      <video
        id="previewVideo"
        controls
        playsinline
      ></video>

      <div class="selected-message">
        ✅ Video Selected Successfully
      </div>

      <div
        id="fileName"
        class="file-name"
      ></div>

    </div>


    <!-- NAME -->

    <div class="field">

      <label>Your Name</label>

      <input
        type="text"
        id="userName"
        placeholder="Enter your name"
      >

    </div>


    <!-- TITLE -->

    <div class="field">

      <label>Video Title</label>

      <input
        type="text"
        id="videoTitle"
        placeholder="Enter video title"
      >

    </div>


    <!-- DESCRIPTION -->

    <div class="field">

      <label>Description</label>

      <textarea
        id="videoDescription"
        placeholder="Write something about your video..."
      ></textarea>

    </div>


    <!-- UPLOAD BUTTON -->

    <button
      id="uploadButton"
      disabled
    >
      🚀 Upload Video
    </button>


    <!-- PROGRESS -->

    <div id="progressArea">

      <div class="progress-background">

        <div id="progressBar"></div>

      </div>

      <div id="status">
        Preparing upload...
      </div>

    </div>

  </div>

</section>


<!-- COMMUNITY -->

<section class="community">

  <div class="community-heading">

    <h2>🌎 Community Videos</h2>

    <p>
      Videos uploaded by the community
    </p>

  </div>


  <div id="videoGallery">

    <div class="message">
      Loading videos...
    </div>

  </div>

</section>


<footer>
  © 2026 VideoHub
</footer>


<script>

/* =====================================================
   SUPABASE SETTINGS
   ===================================================== */

const SUPABASE_URL =
  "YOUR_SUPABASE_PROJECT_URL";

const SUPABASE_KEY =
  "YOUR_SUPABASE_PUBLISHABLE_KEY";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   ELEMENTS
   ===================================================== */

const videoInput =
  document.getElementById("videoInput");

const selectedArea =
  document.getElementById("selectedArea");

const previewVideo =
  document.getElementById("previewVideo");

const fileName =
  document.getElementById("fileName");

const userName =
  document.getElementById("userName");

const videoTitle =
  document.getElementById("videoTitle");

const videoDescription =
  document.getElementById("videoDescription");

const uploadButton =
  document.getElementById("uploadButton");

const progressArea =
  document.getElementById("progressArea");

const progressBar =
  document.getElementById("progressBar");

const status =
  document.getElementById("status");

const videoGallery =
  document.getElementById("videoGallery");


let selectedFile = null;


/* =====================================================
   VIDEO SELECT
   ===================================================== */

videoInput.addEventListener(
  "change",
  function(){

    if(
      !this.files ||
      this.files.length === 0
    ){
      return;
    }

    const file =
      this.files[0];

    if(
      !file.type.startsWith("video/")
    ){

      alert(
        "Please select a video file."
      );

      return;
    }


    selectedFile = file;


    /* PREVIEW */

    const url =
      URL.createObjectURL(file);

    previewVideo.src =
      url;


    selectedArea.style.display =
      "block";


    /* FILE NAME */

    fileName.textContent =
      "📹 " +
      file.name +
      " • " +
      formatFileSize(file.size);


    /*
      IMPORTANT:
      Video select होते ही
      Upload button ENABLE होगा.
    */

    uploadButton.disabled =
      false;


    /* BUTTON TEXT */

    uploadButton.textContent =
      "🚀 Upload Video";


    /* SCROLL TO BUTTON */

    setTimeout(
      function(){

        uploadButton.scrollIntoView({
          behavior:"smooth",
          block:"center"
        });

      },
      200
    );

  }
);


/* =====================================================
   UPLOAD
   ===================================================== */

uploadButton.addEventListener(
  "click",
  uploadVideo
);


async function uploadVideo(){

  if(!selectedFile){

    alert(
      "पहले Gallery से video select करो."
    );

    return;
  }


  /*
    अगर name/title खाली है,
    तो automatic values रखेंगे.
  */

  let name =
    userName.value.trim();

  let title =
    videoTitle.value.trim();

  let description =
    videoDescription.value.trim();


  if(!name){
    name = "Anonymous";
  }


  if(!title){

    title =
      selectedFile.name
        .replace(/\.[^/.]+$/,"");

  }


  uploadButton.disabled =
    true;


  progressArea.style.display =
    "block";


  progressBar.style.width =
    "5%";


  status.textContent =
    "Uploading video...";


  try{

    /* FILE EXTENSION */

    let extension =
      "mp4";


    if(
      selectedFile.name.includes(".")
    ){

      extension =
        selectedFile.name
          .split(".")
          .pop()
          .toLowerCase();

    }


    /* UNIQUE NAME */

    const uniqueName =
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2,12) +
      "." +
      extension;


    const filePath =
      "uploads/" +
      uniqueName;


    progressBar.style.width =
      "20%";


    status.textContent =
      "Uploading video file...";


    /* SUPABASE STORAGE */

    const {
      error:storageError
    } =
      await supabaseClient
        .storage
        .from("videos")
        .upload(
          filePath,
          selectedFile,
          {
            contentType:
              selectedFile.type,

            cacheControl:
              "3600",

            upsert:false
          }
        );


    if(storageError){

      throw storageError;

    }


    progressBar.style.width =
      "65%";


    status.textContent =
      "Saving video information...";


    /* PUBLIC URL */

    const {
      data:publicData
    } =
      supabaseClient
        .storage
        .from("videos")
        .getPublicUrl(
          filePath
        );


    const publicURL =
      publicData.publicUrl;


    /* DATABASE */

    const {
      error:databaseError
    } =
      await supabaseClient
        .from("videos")
        .insert({

          name:name,

          title:title,

          description:description,

          video_url:publicURL

        });


    if(databaseError){

      throw databaseError;

    }


    progressBar.style.width =
      "100%";


    status.textContent =
      "✅ Video uploaded successfully!";


    /* REFRESH COMMUNITY */

    await loadVideos();


    alert(
      "✅ Video successfully uploaded!"
    );


    /* RESET */

    resetForm();


    /* COMMUNITY पर ले जाएँ */

    setTimeout(
      function(){

        document
          .querySelector(".community")
          .scrollIntoView({
            behavior:"smooth"
          });

      },
      300
    );


  }catch(error){

    console.error(
      "UPLOAD ERROR:",
      error
    );


    status.textContent =
      "❌ Upload failed";


    alert(
      "Video upload नहीं हुआ.\n\n" +
      error.message
    );


    uploadButton.disabled =
      false;

  }

}


/* =====================================================
   LOAD COMMUNITY VIDEOS
   ===================================================== */

async function loadVideos(){

  videoGallery.innerHTML =
    '<div class="message">Loading videos...</div>';


  const {
    data,
    error
  } =
    await supabaseClient
      .from("videos")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(
      "LOAD ERROR:",
      error
    );


    videoGallery.innerHTML =
      '<div class="message">Videos load नहीं हो पाए।</div>';

    return;

  }


  videoGallery.innerHTML =
    "";


  if(
    !data ||
    data.length === 0
  ){

    videoGallery.innerHTML =
      '<div class="message">अभी कोई video upload नहीं हुई।</div>';

    return;

  }


  data.forEach(
    function(video){

      /* CARD */

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "video-card";


      /* VIDEO */

      const videoElement =
        document.createElement(
          "video"
        );

      videoElement.src =
        video.video_url;

      videoElement.controls =
        true;

      videoElement.playsInline =
        true;

      videoElement.preload =
        "metadata";


      /* INFO */

      const info =
        document.createElement(
          "div"
        );

      info.className =
        "video-info";


      const title =
        document.createElement(
          "h3"
        );

      title.textContent =
        video.title ||
        "Untitled Video";


      const name =
        document.createElement(
          "p"
        );

      name.textContent =
        "👤 " +
        (video.name || "Anonymous");


      info.appendChild(
        title
      );

      info.appendChild(
        name
      );


      if(
        video.description &&
        video.description.trim()
      ){

        const description =
          document.createElement(
            "p"
          );

        description.style.marginTop =
          "8px";

        description.textContent =
          video.description;

        info.appendChild(
          description
        );

      }


      card.appendChild(
        videoElement
      );

      card.appendChild(
        info
      );

      videoGallery.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   RESET
   ===================================================== */

function resetForm(){

  selectedFile =
    null;


  videoInput.value =
    "";


  previewVideo.src =
    "";


  selectedArea.style.display =
    "none";


  userName.value =
    "";


  videoTitle.value =
    "";


  videoDescription.value =
    "";


  uploadButton.disabled =
    true;


  uploadButton.textContent =
    "🚀 Upload Video";


  progressArea.style.display =
    "none";


  progressBar.style.width =
    "0%";


  status.textContent =
    "";

}


/* =====================================================
   FILE SIZE
   ===================================================== */

function formatFileSize(bytes){

  if(bytes === 0){
    return "0 Bytes";
  }


  const units = [
    "Bytes",
    "KB",
    "MB",
    "GB",
    "TB"
  ];


  const i =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );


  return (
    (bytes /
      Math.pow(1024,i)
    ).toFixed(2) +
    " " +
    units[i]
  );

}


/* =====================================================
   START
   ===================================================== */

loadVideos();

</script>

</body>
</html>
