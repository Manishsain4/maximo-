    <!-- Fix 3: Instagram In-App Browser Auto-Bypass to Chrome -->
    <script>
        (function() {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            var isInstagram = (ua.indexOf('Instagram') > -1) || (ua.indexOf('FBAN') > -1) || (ua.indexOf('FBAV') > -1);
            
            if (isInstagram && /Android/i.test(ua)) {
                var currentUrl = window.location.href.replace(/^https?:\/\//, '');
                window.location.href = "intent://" + currentUrl + "#Intent;scheme=https;package=com.android.chrome;end";
            }
        })();

    <!-- Security & Functionality Scripts -->
    <script>
        // AI & Automated Bot Detection
        function isBot() {
            const userAgent = navigator.userAgent.toLowerCase();
            const botPattern = /bot|googlebot|crawler|spider|robot|crawling|headlesschrome|puppeteer|selenium|phantom/i;
            return navigator.webdriver || botPattern.test(userAgent);
        }

        // Verification Handler Function
        function verifyUser(isYes) {
            if (isBot()) {
                window.location.href = "https://www.google.com";
                return;
            }

            if (isYes) {
                document.getElementById('verificationPopup').style.display = 'none';
                document.getElementById('siteContent').style.display = 'block';
            } else {
                alert("Access Denied!");
                window.location.href = "https://www.google.com";
            }
        }

        // Disable Right Click & Long Press
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
