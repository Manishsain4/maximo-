<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Store</title>
    <style>
        /* Base Reset & Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        /* 18+ & Human Verification Pop-up Overlay */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff; /* Pura White Background */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }

        .popup-box {
            border: 2px solid #000000;
            background-color: #ffffff;
            padding: 30px 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .popup-text {
            font-size: 17px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 25px;
            font-family: Arial, sans-serif;
            line-height: 1.4;
        }

        .popup-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .popup-btn {
            flex: 1;
            padding: 14px 0;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #000000;
            border-radius: 6px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            transition: background-color 0.2s ease;
        }

        .btn-yes {
            background-color: #000000;
            color: #ffffff;
        }

        .btn-yes:hover {
            background-color: #333333;
        }

        .btn-no {
            background-color: #ffffff;
            color: #000000;
        }

        .btn-no:hover {
            background-color: #f0f0f0;
        }

        /* Main Site Content Container (Hidden by default until 'Yes' clicked) */
        .site-container {
            display: none;
        }

        /* Header Section */
        header {
            padding: 15px 0;
            margin-bottom: 30px;
            border-bottom: 2px solid #000000;
        }

        .brand-name {
            font-size: 32px;
            font-weight: 900;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 5px;
        }

        .tagline {
            font-size: 13px;
            color: #000000;
            font-weight: bold;
            letter-spacing: 0.5px;
            font-family: Arial, sans-serif;
        }

        /* Main Video Card Container */
        .product-card {
            border: 2px solid #000000;
            padding: 20px;
            border-radius: 8px;
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* Video Box */
        .video-wrapper {
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
            background-color: #000000;
            border: 1px solid #000000;
        }

        .video-wrapper video {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Caption Text */
        .product-caption {
            display: block !important;
            font-size: 18px !important;
            font-weight: bold !important;
            color: #000000 !important;
            margin: 20px 0 !important;
            line-height: 1.5;
            font-family: Arial, sans-serif;
            -webkit-user-select: text;
            user-select: text;
        }

        /* Full Width Black Buttons */
        a.buy-btn, 
        a.buy-btn:visited, 
        a.buy-btn:link,
        a.demo-btn,
        a.demo-btn:visited,
        a.demo-btn:link,
        a.proof-btn,
        a.proof-btn:visited,
        a.proof-btn:link {
            display: block !important;
            width: 100% !important;
            background-color: #000000 !important;
            color: #ffffff !important;
            padding: 16px 0 !important;
            text-decoration: none !important;
            font-weight: bold !important;
            font-size: 18px !important;
            border-radius: 6px !important;
            font-family: Arial, sans-serif !important;
            border: 2px solid #000000 !important;
            text-align: center !important;
            box-sizing: border-box !important;
        }

        a.demo-btn,
        a.proof-btn {
            margin-top: 12px !important;
        }

        a.buy-btn:hover,
        a.demo-btn:hover,
        a.proof-btn:hover {
            background-color: #333333 !important;
        }

        /* Footer / Description Box */
        footer {
            margin-top: 50px;
            padding: 25px 20px;
            border: 2px solid #000000;
            text-align: center;
            background-color: #ffffff;
            border-radius: 8px;
        }

        .site-desc {
            font-size: 14px;
            color: #000000;
            line-height: 1.6;
            font-family: Arial, sans-serif;
            -webkit-user-select: text;
            user-select: text;
        }
    </style>
</head>
<body>

    <!-- Pop-up Verification Screen -->
    <div class="popup-overlay" id="verificationPopup">
        <div class="popup-box">
            <p class="popup-text">I am a real human & I am over the 18</p>
            <div class="popup-buttons">
                <button class="popup-btn btn-yes" onclick="verifyUser(true)">Yes</button>
                <button class="popup-btn btn-no" onclick="verifyUser(false)">No</button>
            </div>
        </div>
    </div>

    <!-- Main Website Content -->
    <div class="site-container" id="siteContent">
        <!-- Header Section -->
        <header>
            <div class="brand-name">DARK STORE</div>
            <div class="tagline">( The most Darkest vidios in the world 😲 )</div>
        </header>

        <!-- Main Content: Single Video Product -->
        <main>
            <div class="product-card">
                
                <!-- Video Box -->
                <div class="video-wrapper">
                    <video id="myVideo" controls controlsList="nodownload" disablePictureInPicture oncontextmenu="return false;" preload="auto" playsinline webkit-playsinline>
                        <source src="https://cdn.jsdelivr.net/gh/rexx32/video-host@main/product.mp4" type="video/mp4">
                        <source src="https://rexx32.github.io/video-host/product.mp4" type="video/mp4">
                        <source src="https://raw.githack.com/rexx32/video-host/main/product.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>

                <!-- Product Caption Placeholder -->
                <p class="product-caption">.....caption.....</p>

                <!-- Black Buy Now Button -->
                <a href="https://t.me/Rebel_by_dark_side?text=I%20Am%20See%20Your%20Full%20Demo%20On%20Instagram%20Profile%2C%20yes%20I%20Am%20Ready%20For%20Buy%20Your%20Content%20Group%20In%2099%E2%82%B9" class="buy-btn" target="_blank">Buy Now</a>

                <!-- See Demo Video's Button -->
                <a href=".........link......" class="demo-btn" target="_blank">See Demo Video's</a>

                <!-- Check Proof Button -->
                <a href="https://t.me/+r0zUPIsB5hIyMDhl" class="proof-btn" target="_blank">Check Proof</a>

            </div>
        </main>

        <!-- Footer Section -->
        <footer>
            <p class="site-desc">.....site-description.....</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script>
        // Verification Handler Function
        function verifyUser(isYes) {
            if (isYes) {
                // Pop-up hide karo
                document.getElementById('verificationPopup').style.display = 'none';
                // Main site show karo
                document.getElementById('siteContent').style.display = 'block';
            } else {
                // Agar No click kare to Google par redirect kar do
                alert("Access Denied! You must be 18+ to view this site.");
                window.location.href = "https://www.google.com";
            }
        }

        // Disable Right Click / Long Press
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
    </script>

</body>
</html>
