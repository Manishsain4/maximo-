<script>
function buyNumber(country, price) {
  alert(
    "Country: " + country +
    "\nPrice: $" + price.toFixed(2) +
    "\n\nPayment/number API will be connected here."
  );
}

function searchCountry() {
  const search = document
    .getElementById("search")
    .value
    .toLowerCase();

  const cards = document.querySelectorAll(".country-card");

  cards.forEach(card => {
    const country = card
      .getAttribute("data-country")
      .toLowerCase();

    card.style.display =
      country.includes(search) ? "block" : "none";
  });
}
</script>
