<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VideoHub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080d18;
      color: white;
    }

    header {
      background: #111827;
      padding: 16px 20px;
      border-bottom: 1px solid #263244;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #60a5fa;
    }

    .nav-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 60px 20px;
      background: linear-gradient(135deg, #111827, #172554);
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #cbd5e1;
      font-size: 17px;
    }

    .upload-section {
      max-width: 850px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .upload-card {
      background: #111827;
      border: 1px solid #263244;
      border-radius: 18px;
      padding: 25px;
    }

    .upload-card h2 {
      margin-bottom: 8px;
    }

    .sub {
      color: #94a3b8;
      margin-bottom: 25px;
    }

    /* GALLERY BUTTON */

    .gallery-button {
      width: 100%;
      padding: 18px;
      border: 2px dashed #3b82f6;
      border-radius: 14px;
      background: #0f172a;
      color: white;
      cursor: pointer;
      text-align: center;
      transition: 0.2s;
    }

    .gallery-button:hover {
      background: #172554;
    }

    .gallery-icon {
      font-size: 45px;
      margin-bottom: 8px;
    }

    .gallery-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .gallery-subtitle {
      color: #94a3b8;
      font-size: 14px;
    }

    #videoInput {
      display: none;
    }

    /* PREVIEW */

    #previewContainer {
      display: none;
      margin-top: 20px;
    }

    #previewVideo {
      width: 100%;
      max-height: 500px;
      background: black;
      border-radius: 12px;
    }

    .selected-file {
      background: #0f172a;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      color: #93c5fd;
      font-size: 14px;
      word-break: break-word;
    }

    /* FORM */

    .field {
      margin-top: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 13px;
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    .field textarea {
      min-height: 100px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: #3b82f6;
    }

    /* UPLOAD BUTTON */

    #uploadButton {
      width: 100%;
      padding: 15px;
      margin-top: 22px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #uploadButton:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    /* PROGRESS */

    #progressContainer {
      display: none;
      margin-top: 20px;
    }

    .progress-bg {
      width: 100%;
      height: 10px;
      background: #1e293b;
      border-radius: 20px;
      overflow: hidden;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: #3b82f6;
      transition: 0.3s;
    }

    #uploadStatus {
      text-align: center;
      margin-top: 10px;
      color: #93c5fd;
    }

    /* GALLERY */

    .community {
      max-width: 1100px;
      margin: 70px auto;
      padding: 0 20px;
    }

    .community-title {
      text-align: center;
      margin-bottom: 30px;
    }

    .community-title h2 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .community-title p {
      color: #94a3b8;
    }

    #videoGallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .video-card {
      background: #111827;
      border: 1px solid #263244;
      border-radius: 14px;
      overflow: hidden;
    }

    .video-card video {
      width: 100%;
      display: block;
      background: black;
      aspect-ratio: 16 / 9;
    }

    .video-details {
      padding: 15px;
    }

    .video-details h3 {
      margin-bottom: 8px;
      word-break: break-word;
    }

    .video-details p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .message {
      text-align: center;
      color: #94a3b8;
      padding: 30px;
    }

    footer {
      text-align: center;
      color: #64748b;
      padding: 35px 20px;
      margin-top: 60px;
      border-top: 1px solid #1e293b;
    }

    @media (max-width: 600px) {

      .hero h1 {
        font-size: 32px;
      }

      .upload-card {
        padding: 18px;
      }

      .logo {
        font-size: 20px;
      }

      .nav-btn {
        padding: 8px 12px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="nav">

    <div class="logo">
      🎬 VideoHub
    </div>

    <button
      class="nav-btn"
      onclick="scrollToUpload()"
    >
      Upload
    </button>

  </div>

</header>


<section class="hero">

  <h1>
    Share Your Videos
  </h1>

  <p>
    Upload videos and share them with everyone.
  </p>

</section>


<!-- UPLOAD -->

<section
  class="upload-section"
  id="uploadSection"
>

  <div class="upload-card">

    <h2>
      🎥 Upload Your Video
    </h2>

    <p class="sub">
      Select a video directly from your phone gallery.
    </p>


    <!-- IMPORTANT GALLERY BUTTON -->

    <label
      for="videoInput"
      class="gallery-button"
    >

      <div class="gallery-icon">
        📱
      </div>

      <div class="gallery-title">
        Choose Video from Gallery
      </div>

      <div class="gallery-subtitle">
        Tap here to select a video from your phone
      </div>

    </label>


    <!-- FILE INPUT -->

    <input
      type="file"
      id="videoInput"
      accept="video/*"
    >


    <!-- PREVIEW -->

    <div id="previewContainer">

      <video
        id="previewVideo"
        controls
        playsinline
      ></video>

      <div
        class="selected-file"
        id="selectedFile"
      ></div>

    </div>


    <!-- NAME -->

    <div class="field">

      <label>
        Your Name
      </label>

      <input
        type="text"
        id="userName"
        placeholder="Enter your name"
        maxlength="100"
      >

    </div>


    <!-- TITLE -->

    <div class="field">

      <label>
        Video Title
      </label>

      <input
        type="text"
        id="videoTitle"
        placeholder="Enter video title"
        maxlength="200"
      >

    </div>


    <!-- DESCRIPTION -->

    <div class="field">

      <label>
        Description
      </label>

      <textarea
        id="videoDescription"
        placeholder="Write something about your video..."
        maxlength="1000"
      ></textarea>

    </div>


    <!-- UPLOAD -->

    <button
      id="uploadButton"
      disabled
    >
      🚀 Upload Video
    </button>


    <!-- PROGRESS -->

    <div id="progressContainer">

      <div class="progress-bg">

        <div id="progressBar"></div>

      </div>

      <div id="uploadStatus">
        Uploading...
      </div>

    </div>

  </div>

</section>


<!-- COMMUNITY GALLERY -->

<section class="community">

  <div class="community-title">

    <h2>
      🌎 Community Video Gallery
    </h2>

    <p>
      Videos uploaded by people in the community
    </p>

  </div>


  <div id="videoGallery">

    <div class="message">
      Loading videos...
    </div>

  </div>

</section>


<footer>
  © 2026 VideoHub
</footer>


<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "YOUR_SUPABASE_PROJECT_URL";

const SUPABASE_KEY =
  "YOUR_SUPABASE_PUBLISHABLE_KEY";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   ELEMENTS
   ===================================================== */

const videoInput =
  document.getElementById("videoInput");

const previewContainer =
  document.getElementById("previewContainer");

const previewVideo =
  document.getElementById("previewVideo");

const selectedFile =
  document.getElementById("selectedFile");

const userName =
  document.getElementById("userName");

const videoTitle =
  document.getElementById("videoTitle");

const videoDescription =
  document.getElementById("videoDescription");

const uploadButton =
  document.getElementById("uploadButton");

const progressContainer =
  document.getElementById("progressContainer");

const progressBar =
  document.getElementById("progressBar");

const uploadStatus =
  document.getElementById("uploadStatus");


let selectedVideoFile = null;


/* =====================================================
   GALLERY SELECT
   ===================================================== */

videoInput.addEventListener(
  "change",
  function () {

    if (!this.files || this.files.length === 0) {
      return;
    }

    const file = this.files[0];

    selectVideo(file);

  }
);


/* =====================================================
   SELECT VIDEO
   ===================================================== */

function selectVideo(file) {

  if (!file.type.startsWith("video/")) {

    alert(
      "Please select a video file."
    );

    return;
  }


  selectedVideoFile = file;


  /* SHOW PREVIEW */

  const videoURL =
    URL.createObjectURL(file);

  previewVideo.src =
    videoURL;


  previewContainer.style.display =
    "block";


  /* SHOW FILE INFORMATION */

  selectedFile.textContent =
    "📹 " +
    file.name +
    " • " +
    formatFileSize(file.size);


  checkForm();

}


/* =====================================================
   CHECK FORM
   ===================================================== */

userName.addEventListener(
  "input",
  checkForm
);

videoTitle.addEventListener(
  "input",
  checkForm
);


function checkForm() {

  const name =
    userName.value.trim();

  const title =
    videoTitle.value.trim();


  uploadButton.disabled =
    !selectedVideoFile ||
    name.length < 2 ||
    title.length < 2;

}


/* =====================================================
   UPLOAD
   ===================================================== */

uploadButton.addEventListener(
  "click",
  uploadVideo
);


async function uploadVideo() {

  if (!selectedVideoFile) {

    alert(
      "Please choose a video from your gallery."
    );

    return;
  }


  const name =
    userName.value.trim();

  const title =
    videoTitle.value.trim();

  const description =
    videoDescription.value.trim();


  uploadButton.disabled =
    true;


  progressContainer.style.display =
    "block";


  progressBar.style.width =
    "10%";


  uploadStatus.textContent =
    "Uploading video...";


  try {

    /* FILE EXTENSION */

    let extension =
      "mp4";


    if (
      selectedVideoFile.name.includes(".")
    ) {

      extension =
        selectedVideoFile.name
          .split(".")
          .pop()
          .toLowerCase();

    }


    /* UNIQUE FILE NAME */

    const fileName =
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2, 12) +
      "." +
      extension;


    const filePath =
      "uploads/" +
      fileName;


    progressBar.style.width =
      "25%";


    /* UPLOAD FILE */

    const {
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from("videos")
        .upload(
          filePath,
          selectedVideoFile,
          {
            contentType:
              selectedVideoFile.type,

            cacheControl:
              "3600",

            upsert:
              false
          }
        );


    if (uploadError) {
      throw uploadError;
    }


    progressBar.style.width =
      "65%";


    /* GET PUBLIC URL */

    const {
      data: publicData
    } =
      supabaseClient
        .storage
        .from("videos")
        .getPublicUrl(
          filePath
        );


    const publicURL =
      publicData.publicUrl;


    progressBar.style.width =
      "80%";


    /* SAVE DATABASE RECORD */

    const {
      error: databaseError
    } =
      await supabaseClient
        .from("videos")
        .insert({

          name: name,

          title: title,

          description: description,

          video_url: publicURL

        });


    if (databaseError) {
      throw databaseError;
    }


    /* SUCCESS */

    progressBar.style.width =
      "100%";


    uploadStatus.textContent =
      "✅ Video uploaded successfully!";


    alert(
      "Video uploaded successfully!"
    );


    /* REFRESH GALLERY */

    await loadVideos();


    /* RESET */

    resetForm();


  } catch (error) {

    console.error(
      error
    );


    uploadStatus.textContent =
      "❌ Upload failed";


    alert(
      "Upload failed:\n\n" +
      error.message
    );


    uploadButton.disabled =
      false;

  }

}


/* =====================================================
   LOAD VIDEOS
   ===================================================== */

async function loadVideos() {

  const gallery =
    document.getElementById(
      "videoGallery"
    );


  gallery.innerHTML =
    '<div class="message">Loading videos...</div>';


  const {
    data,
    error
  } =
    await supabaseClient
      .from("videos")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      error
    );


    gallery.innerHTML =
      '<div class="message">Unable to load videos.</div>';

    return;

  }


  gallery.innerHTML =
    "";


  if (!data || data.length === 0) {

    gallery.innerHTML =
      '<div class="message">No videos uploaded yet.</div>';

    return;

  }


  data.forEach(
    function (video) {

      /* CARD */

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "video-card";


      /* VIDEO */

      const videoElement =
        document.createElement(
          "video"
        );


      videoElement.src =
        video.video_url;

      videoElement.controls =
        true;

      videoElement.playsInline =
        true;

      videoElement.preload =
        "metadata";


      /* DETAILS */

      const details =
        document.createElement(
          "div"
        );


      details.className =
        "video-details";


      /* TITLE */

      const titleElement =
        document.createElement(
          "h3"
        );


      titleElement.textContent =
        video.title ||
        "Untitled Video";


      /* USER */

      const nameElement =
        document.createElement(
          "p"
        );


      nameElement.textContent =
        "👤 " +
        (video.name || "Unknown");


      details.appendChild(
        titleElement
      );


      details.appendChild(
        nameElement
      );


      /* DESCRIPTION */

      if (
        video.description &&
        video.description.trim()
      ) {

        const descriptionElement =
          document.createElement(
            "p"
          );


        descriptionElement.style.marginTop =
          "8px";


        descriptionElement.textContent =
          video.description;


        details.appendChild(
          descriptionElement
        );

      }


      card.appendChild(
        videoElement
      );


      card.appendChild(
        details
      );


      gallery.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   RESET
   ===================================================== */

function resetForm() {

  selectedVideoFile =
    null;


  videoInput.value =
    "";


  previewVideo.src =
    "";


  previewContainer.style.display =
    "none";


  userName.value =
    "";


  videoTitle.value =
    "";


  videoDescription.value =
    "";


  uploadButton.disabled =
    true;


  progressContainer.style.display =
    "none";


  progressBar.style.width =
    "0%";


  uploadStatus.textContent =
    "";

}


/* =====================================================
   FILE SIZE
   ===================================================== */

function formatFileSize(bytes) {

  if (bytes === 0) {
    return "0 Bytes";
  }


  const units = [
    "Bytes",
    "KB",
    "MB",
    "GB",
    "TB"
  ];


  const i =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );


  return (
    (bytes /
      Math.pow(1024, i)
    ).toFixed(2) +
    " " +
    units[i]
  );

}


/* =====================================================
   SCROLL
   ===================================================== */

function scrollToUpload() {

  document
    .getElementById(
      "uploadSection"
    )
    .scrollIntoView({
      behavior: "smooth"
    });

}


/* =====================================================
   START
   ===================================================== */

loadVideos();

</script>

</body>
</html>
